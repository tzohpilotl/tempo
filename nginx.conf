server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Forward /api/* to the NestJS backend container
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tells NestJS the original protocol — important for OAuth callback URLs
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for session cookies to pass through correctly
        proxy_set_header  Cookie     $http_cookie;
        proxy_pass_header Set-Cookie;

        # Prevent nginx from buffering streaming responses
        proxy_buffering off;
    }

    # Cache hashed static assets aggressively (Vite adds content hashes)
    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router — any unmatched route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
