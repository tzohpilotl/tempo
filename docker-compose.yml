version: '3.9'

services:
  backend:
    image: ghcr.io/${GITHUB_USERNAME}/time-tracker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/time-tracker.sqlite
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # Optional: set to your Google email to restrict access to a single user
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:-}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      default:
      droplet_proxy_network:
        aliases:
          - time-tracker-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/${GITHUB_USERNAME}/time-tracker-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
      droplet_proxy_network:
        aliases:
          - time-tracker-frontend

volumes:
  sqlite_data:
    driver: local

networks:
  default: {}
  droplet_proxy_network:
    external: true
    name: droplet_proxy_network
