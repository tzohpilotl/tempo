version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/time-tracker.sqlite
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # OAuth callback must match what's registered in Google Cloud Console
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      # SQLite data persists across container restarts and re-deploys
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        # nginx won't start until the backend passes its healthcheck
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
